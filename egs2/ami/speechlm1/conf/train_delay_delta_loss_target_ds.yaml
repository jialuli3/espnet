# Model
transformer: huggingface
transformer_conf:
    hf_model_tag: HuggingFaceTB/SmolLM2-1.7B
    activation_checkpointing: true
    
corelm: ar_delay
corelm_conf:
    share_emb: false

# loss
modality_weights: {
    "g2p": 1.0,
    "ssl": 0.5,
    "codec": 0.0625,
    "text_bpe": 1.0,
    "diar_tokenizer": 1.0,
    "special_token": 10.0,
}
loss_region: target

# General Dataloader configuration
batch_type: numel
batch_bins: 45000
# num_iters_per_epoch: 5000
max_epoch: 10
num_workers: 2
# drop_last_iter: true
log_interval: 10
use_amp: false

# optimization related
optim: adam
accum_grad: 1
grad_clip: 1
optim_conf:
    lr: 0.0003
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 4000

best_model_criterion:
-   - valid
    - ce_loss
    - min
keep_nbest_models: 3

# Data preprocessing
codec_token_per_frame: 9
codec_token_in_use: 9
speaker_prompt_length: 500

# specaug
asr_apply_time_mask: true
asr_time_mask_config:
    mask_width_ratio_range:
    - 0.
    - 0.05
    num_mask: 10

# deepspeed
use_deepspeed: true
deepspeed_config: conf/deepspeed_ddp_zero1_smollm2_librimix.json 
deepspeed_step_sync: false
